<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock-Paper-Scissors</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>

<body>
    <h1>ROCK PAPER SCISSORS!</h1>


    
    <div class="main-container">
            
    <div id="statsDisplay" class="stats-box">
        <div class="text-container">
            <p>Total Rounds:</p>
            <p>Your Wins:</p>
            <p>Computer Wins:</p>
        </div>
        <div class="result container">
            <p><span id="totalRounds">0</span></p>
            <p><span id="userWins">0</span></p>
            <p><span id="compWins">0</span></p>
        </div>
    </div>


        <!-- round text and winner text You Win You lost -->
        <h2 id="round-indicator"></h2>
        <div class="rounds-container">
            <h5 id="round-count-label">Enter number of Rounds: </h5>
            <input type="number" class="round-count" value="5">

        </div>
        <div class="game-container">
            <div class="user-container">

                <!-- score for player -->
                <div class="score-user score">0</div>
                <!-- image conatiner for users choice -->
                <div class="user-choice-dis choice-dis">?</div>

                <div class="button-container list">
                    <button class="userbutton disable" id="rockButtonUser">✊</button>
                    <button class="userbutton disable" id="paperButtonUser">🖐️</button>
                    <button class="userbutton disable" id="scissorsButtonUser">✌️</button>
                </div>
                <div id="choose-wisely">
                    <div id="choose-wisely-text">Choose Wisely!</div>
                </div>
                <div class="player">You</div>





            </div>
            <div class="vs">vs</div>
            <div class="comp-container">

                <!-- score for computer -->
                <div class="score-comp score">0</div>
                <!-- image container for computer random choice -->
                <div class="comp-choice-dis choice-dis">?</div>
                <div class="comp-random-list">? ? ?</div>
                <div id="speedControlContainer">
                    <span class="material-icons" id="decreaseSpeed">chevron_left</span>
                    <div id="intervalDisplay">x 1.00</div>
                    <span class="material-icons" id="increaseSpeed">chevron_right</span>
                    <span class="material-icons" id="resetSpeed">refresh</span>
                </div>

                <!-- <div class="button-container list">
                    <button class="compbutton" id="rockButtonComp">✊</button>
                    <button class="compbutton" id="paperButtonComp">🖐️</button>
                    <button class="compbutton" id="scissorsButtonComp">✌️</button>
                </div> -->

                <div class="player">Computer</div>



            </div>

        </div>
        <!-- play butotn  -->
        <button class="play-button button-controls">Play Game</button>

        <!-- log container for rounds -->
        <div class="round-history">
            <div class="players-name">
                <div class="round-text table">Round: </div>
                <div class="player-name table">You: </div>
                <div class="computer-name table">Comp: </div>
            </div>
            <!-- insert history resutl here -->
        </div>


        <button class="button-controls button-stop">Stop Game</button>
    </div>


    <script src="script.js"></script>
</body>

</html>
